<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Florida Flight Deals travel placeholder</title>
  <desc id="desc">A branded coastal travel scene with a Florida route line, sun, ocean blue sky, and flight icon.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0F2FE"/>
      <stop offset="0.52" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FAFAF7"/>
    </linearGradient>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0284C7"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="954" cy="164" r="76" fill="#F59E0B" opacity="0.86"/>
  <path d="M0 576 C176 520 284 640 454 584 C640 524 780 490 1200 548 L1200 800 L0 800 Z" fill="#BAE6FD"/>
  <path d="M0 646 C206 574 392 724 604 648 C780 584 948 574 1200 622 L1200 800 L0 800 Z" fill="url(#ocean)" opacity="0.92"/>
  <path d="M176 438 C330 308 503 497 667 363 C812 244 952 323 1045 255" fill="none" stroke="#0F172A" stroke-width="8" stroke-linecap="round" stroke-dasharray="20 24" opacity="0.36"/>
  <g filter="url(#shadow)">
    <rect x="360" y="255" width="480" height="240" rx="42" fill="#FFFFFF" opacity="0.94"/>
    <path d="M724 361 L650 377 L604 305 C597 295 584 291 573 296 L562 301 C552 306 549 319 556 328 L604 393 L532 414 L500 385 L481 394 L513 448 L568 480 L576 461 L559 423 L632 403 L686 477 C693 487 706 491 717 486 L729 481 C739 476 743 463 736 453 L690 388 L765 367 C779 363 790 353 796 340 L806 316 C809 309 803 302 796 304 L771 312 C758 317 741 324 724 361 Z" fill="#0284C7"/>
    <circle cx="472" cy="374" r="15" fill="#F59E0B"/>
    <circle cx="728" cy="374" r="15" fill="#14B8A6"/>
  </g>
  <text x="600" y="575" text-anchor="middle" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">Florida Flight Deals</text>
  <text x="600" y="623" text-anchor="middle" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Curated airfare ideas and route searches</text>
